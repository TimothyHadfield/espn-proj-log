# Every hour: read ESPN's projections for every week left, log what changed,
# commit. Public repo, so Actions minutes are free.
name: record

on:
  schedule:
    - cron: '17 * * * *'   # off the top of the hour, when GitHub's queue is busiest
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node record.mjs
      - name: Commit
        run: |
          git config user.name "proj-recorder"
          git config user.email "proj-recorder@users.noreply.github.com"
          git add state log
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "Projections $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
